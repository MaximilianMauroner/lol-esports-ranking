name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.16.0"

jobs:
  checks:
    name: Install, verify, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      full-validation: ${{ steps.changes.outputs.full-validation }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Compare the synthetic PR merge to its first parent. Missing parents fail open.
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Classify affected paths
        id: changes
        run: node tools/dev/ci-affected-paths.mjs >> "$GITHUB_OUTPUT"

      - name: Verify
        run: pnpm run verify

      - name: Bundle
        run: pnpm run bundle

      - name: Incremental production-shaped gate
        if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && steps.changes.outputs.full-validation == 'true')
        run: pnpm run benchmark:incremental:gate

  rust-contracts:
    name: Rust contracts and model config parity
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && needs.checks.outputs.full-validation == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker -> target
          cmd-format: rustup run 1.98.0 {0}
          # Keep dependency products, not workspace binaries or incremental state.
          cache-bin: false
          cache-all-crates: false
          cache-on-failure: false
      - name: Format
        run: cargo +1.98.0 fmt --manifest-path worker/Cargo.toml --all --check
      - name: Clippy
        run: cargo +1.98.0 clippy --manifest-path worker/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Fixture tests
        run: cargo +1.98.0 test --manifest-path worker/Cargo.toml --workspace --locked
      - name: Build CLI
        run: cargo +1.98.0 build --manifest-path worker/Cargo.toml --package ranking-refresh --locked
      - name: Build native local HTTP service
        run: cargo +1.98.0 build --manifest-path worker/Cargo.toml --package league-platform --bin platform-api --locked
      - name: Prepare frozen native HTTP reference input
        run: node --input-type=module -e "await (await import('./scripts/reference-public-data.mjs')).ensureReferencePublicData()"
      - name: Native local HTTP and browser reader proof
        env:
          RANKING_NATIVE_HTTP_BINARY: ${{ github.workspace }}/worker/target/debug/platform-api
          RANKING_NATIVE_HTTP_RETAINED_DATA_DIR: ${{ github.workspace }}/data/reference/8adbc0a4239fd0dfba2094b3e70f60b513560de4/public/data
        run: pnpm exec tsx --tsconfig tsconfig.app.json --test tests/nativeRankingHttp.integration.ts
      - name: Native production HTTP and process lifecycle
        env:
          RANKING_NATIVE_HTTP_BINARY: ${{ github.workspace }}/worker/target/debug/platform-api
          RANKING_NATIVE_SERVER_TESTS: 'true'
        run: pnpm exec tsx --tsconfig tsconfig.app.json --test --test-concurrency=1 tests/railwayServer.test.ts tests/nativeServingLifecycle.integration.ts
      - name: Live model config parity
        run: pnpm exec tsx --tsconfig tsconfig.app.json tools/audit/check-rust-parity.ts
      - name: Native series-pass replay parity and CLI boundaries
        env:
          RANKING_COMPUTE_TEST_BINARY: ${{ github.workspace }}/worker/target/debug/ranking-refresh
        run: |
          test -x "$RANKING_COMPUTE_TEST_BINARY"
          pnpm exec tsx --tsconfig tsconfig.app.json --test tests/seriesPassShadow.test.ts
      - name: Rust raw seam integration
        env:
          RANKING_RAW_SOURCE_WORKER: rust
          RANKING_REFRESH_BINARY: ${{ github.workspace }}/worker/target/debug/ranking-refresh
          RANKING_RUST_TEST_BINARY: ${{ github.workspace }}/worker/target/debug/ranking-refresh
        run: pnpm exec tsx --tsconfig tsconfig.app.json --test tests/rawSourceGeneration.test.ts tests/rustRawSourceParity.test.ts
      - name: Raw benchmark corpus parity and memory
        env:
          RANKING_REFRESH_BINARY: ${{ github.workspace }}/worker/target/release/ranking-refresh
        run: |
          cargo +1.98.0 build --manifest-path worker/Cargo.toml --package ranking-refresh --release --locked
          node --max-old-space-size=2048 --expose-gc --import tsx scripts/benchmark-incremental-ranking.ts --raw-seam-parity
      - name: Rust provider replay and failure integration
        env:
          RANKING_PROVIDER_FETCH_WORKER: rust
          RANKING_REFRESH_BINARY: ${{ github.workspace }}/worker/target/release/ranking-refresh
          RANKING_RUST_TEST_BINARY: ${{ github.workspace }}/worker/target/release/ranking-refresh
        run: pnpm exec tsx --tsconfig tsconfig.app.json --test tests/downloadLocalData.test.ts tests/rustProviderFetchParity.test.ts
      - name: Set up Go for isolated storage acceptance
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.2'
          cache: false
      - name: Cache pinned MinIO and Go build inputs
        id: minio-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/bin/minio
            ~/go/pkg/mod
            ~/.cache/go-build
          key: checks-${{ runner.os }}-${{ runner.arch }}-go-1.24.2-minio-0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
          enableCrossOsArchive: false
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      - name: Build pinned MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        # Official RELEASE.2025-04-22T22-12-26Z source. Published images are unavailable.
        run: go install github.com/minio/minio@0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
      - name: Native storage against isolated MinIO
        env:
          RANKING_STORAGE_TEST_ENDPOINT: http://127.0.0.1:9000
          RANKING_RUST_TEST_BINARY: ${{ github.workspace }}/worker/target/release/ranking-refresh
        run: |
          storage_root=$(mktemp -d)
          MINIO_ROOT_USER=minio-test MINIO_ROOT_PASSWORD=minio-test-password \
            "$HOME/go/bin/minio" server "$storage_root" --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 > "$storage_root/server.log" 2>&1 &
          storage_pid=$!
          trap 'kill "$storage_pid"; wait "$storage_pid" || true; rm -rf "$storage_root"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready
          pnpm exec tsx --tsconfig tsconfig.app.json --test tests/rustStorageMinio.test.ts
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Override the action's insecure entitlement defaults while keeping GC enabled.
          buildkitd-flags: --oci-worker-gc=true
      - name: Prepare worker image context
        # Exclude host Cargo products, which would invalidate COPY layers on every run.
        run: |
          mkdir "$RUNNER_TEMP/worker-image"
          git archive HEAD Dockerfile.refresh Dockerfile.refresh.dockerignore worker src/domains/rankings/internal/published/referenceFields.json | tar -x -C "$RUNNER_TEMP/worker-image"
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/worker-image
          file: ${{ runner.temp }}/worker-image/Dockerfile.refresh
          tags: ranking-refresh
          load: true
          push: false
          # One rolling scope per ref; PR caches cannot overwrite base-branch caches.
          cache-from: type=gha,scope=checks-worker-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0
          cache-to: type=gha,scope=checks-worker-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0,mode=max,timeout=5m,ignore-error=true
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
      - name: Fixture tests in image build environment
        run: |
          docker run --rm -v "$PWD:/app" -v /app/worker/target -w /app rust:1.98-slim-bookworm \
            cargo +1.98.0 test --manifest-path worker/Cargo.toml --workspace --locked
      - name: Image model config parity
        run: |
          printf '#!/bin/sh\nexec docker run --rm ranking-refresh "$@"\n' > /tmp/ranking-refresh-image
          chmod +x /tmp/ranking-refresh-image
          pnpm exec tsx --tsconfig tsconfig.app.json tools/audit/check-rust-parity.ts /tmp/ranking-refresh-image

  web-image:
    name: Native serving image
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && needs.checks.outputs.full-validation == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-flags: --oci-worker-gc=true
      - name: Prepare tracked source
        run: |
          mkdir "$RUNNER_TEMP/web-image"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/web-image"
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/web-image
          file: ${{ runner.temp }}/web-image/worker/Dockerfile.web
          tags: ranking-web
          load: true
          push: false
          cache-from: type=gha,scope=checks-web-${{ runner.os }}-${{ runner.arch }}-node24-rust1.98.0
          cache-to: type=gha,scope=checks-web-${{ runner.os }}-${{ runner.arch }}-node24-rust1.98.0,mode=max,timeout=5m,ignore-error=true
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
      - name: Verify image data delivery and shutdown
        run: |
          docker run -d --name ranking-web-check -e PORT=8080 -p 127.0.0.1:4174:8080 ranking-web
          trap 'docker logs ranking-web-check; docker rm -f ranking-web-check' EXIT
          curl --fail --connect-timeout 2 --max-time 5 --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:4174/api/live
          curl --fail --dump-header "$RUNNER_TEMP/native-headers" --output /dev/null http://127.0.0.1:4174/data/ranking-summary.json
          grep -i '^x-ranking-runtime: rust' "$RUNNER_TEMP/native-headers"
          docker stop --time 15 ranking-web-check
          test "$(docker inspect --format '{{.State.ExitCode}}' ranking-web-check)" = 0
